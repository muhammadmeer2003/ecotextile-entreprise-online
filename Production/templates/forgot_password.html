<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Forgot Password — EcoTextile</title></head><body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6"><div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8"><p class="text-emerald-400 text-xs font-bold tracking-widest uppercase">Account recovery</p><h1 class="text-3xl font-black mt-2">Forgot Password?</h1><p class="text-slate-400 mt-2 mb-6">Enter your registered work email. We’ll send a secure reset link.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="space-y-2 mb-5">{% for category,message in messages %}<div class="rounded-xl px-4 py-3 text-sm bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}<form method="post" class="space-y-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="block"><span class="text-sm text-slate-300">Work email</span><input name="email" type="email" required autocomplete="email" class="mt-2 w-full rounded-2xl bg-slate-950 border border-slate-800 px-4 py-3.5 outline-none focus:border-emerald-400" placeholder="operations@company.com"></label><button class="w-full rounded-2xl bg-emerald-400 text-emerald-950 font-black py-3.5">Send Reset Link</button></form><p class="text-center text-sm text-slate-500 mt-6"><a href="{{ url_for('routes.login') }}" class="text-emerald-400 font-bold">Back to Login</a></p></div></body></html>
