<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Reset Password — EcoTextile</title></head><body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6"><div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8"><p class="text-emerald-400 text-xs font-bold tracking-widest uppercase">Secure password reset</p><h1 class="text-3xl font-black mt-2">Create New Password</h1><p class="text-slate-400 mt-2 mb-6">Choose a new password with at least 8 characters.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="space-y-2 mb-5">{% for category,message in messages %}<div class="rounded-xl px-4 py-3 text-sm bg-red-500/10 text-red-300 border border-red-500/20">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}<form method="post" class="space-y-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="block"><span class="text-sm text-slate-300">New password</span><input name="password" type="password" required minlength="8" autocomplete="new-password" class="mt-2 w-full rounded-2xl bg-slate-950 border border-slate-800 px-4 py-3.5"></label><label class="block"><span class="text-sm text-slate-300">Confirm password</span><input name="confirm_password" type="password" required minlength="8" autocomplete="new-password" class="mt-2 w-full rounded-2xl bg-slate-950 border border-slate-800 px-4 py-3.5"></label><button class="w-full rounded-2xl bg-emerald-400 text-emerald-950 font-black py-3.5">Change Password</button></form></div></body></html>
